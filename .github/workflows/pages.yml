# Publishes the static site in site/ to GitHub Pages.
#
# Runs on every push to main that touches site/ (or this workflow), and on
# demand via "Run workflow" in the Actions tab (or: gh workflow run pages.yml).
#
# Forks: enable Settings -> Pages -> Source "GitHub Actions" and the same
# workflow publishes to https://<user>.github.io/<repo>/ (the site only uses
# relative URLs). site/CNAME is ignored by Actions-based Pages deployments;
# the custom domain is configured in the repository's Pages settings.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check site contents
        run: |
          set -eu
          # The artifact tar dereferences symlinks; refuse any so nothing
          # outside site/ can leak into the published site.
          links=$(find site -type l)
          if [ -n "$links" ]; then
            echo "::error::Symlinks are not allowed in site/:"; echo "$links"; exit 1
          fi
          test -s site/index.html
          for f in manifest.json endpoints.json reading-guide.json annotations.json routes.bin.gz source-spans.bin.gz \
                   names.txt.gz modules.txt.gz graph.bin.gz \
                   grh/manifest.json grh/annotations.json grh/names.txt.gz grh/graph.bin.gz grh/routes.bin.gz grh/source-spans.bin.gz; do
            test -s "site/$f" || { echo "::error::Missing or empty site/$f"; exit 1; }
          done
          for f in site/*.gz site/grh/*.gz; do gzip -t "$f"; done
          for f in site/*.json site/grh/*.json; do python3 -m json.tool "$f" > /dev/null; done
          du -ah site | sort -h | tail -n 15

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
